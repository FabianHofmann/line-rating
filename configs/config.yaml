scenario:
  rating: ['dlr', 'slr']
  clusters: ["all"]
  opts: ["Co2L"]
  year: [2020, 2030]
  figure: ["operation_map", "capacity_map", "curtailment_map", "curtailment_bar", "capacity_bar", "historical_curtailment_bar"]

test:
  rating: ['dlr', 'slr']
  clusters: [5]
  opts: ["Co2L-4H"]
  year: [2020, 2030]

plotting:
  map:
    boundaries: [5.5, 15.5, 47,  55]
    #If None or commented out the plot_main.py automatically calculates the bus and line factor. If factor is given, then the factor is taken.
    capacity:
      bus_size_factor: 1.e-5
      line_width_factor: 5.e-4
      refsize: 2000 # at what capacity should circle be drawn
    operation:
      bus_size_factor: 5.e-5
      line_width_factor: 5.e-3
      refsize: 1000 # at what capacity should circle be drawn
    curtailment:
      bus_size_factor: 8.e-10
      line_width_factor: 1.e-3
      refsize: 1000 # at what capacity should circle be drawn
    utilization:
      refsize: 1000 # at what capacity should circle be drawn
